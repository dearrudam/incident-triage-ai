# Application
quarkus.application.name=incident-triage-mvp
quarkus.http.port=8080

# Datasource — defaults match docker-compose.yml service
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:triage}
quarkus.datasource.password=${DB_PASSWORD:triage}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:incidenttriage}

# Hibernate ORM
# WARNING: drop-and-create is for MVP only — use Flyway/Liquibase before going to production
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# LangChain4j — Ollama
# WARNING: changing the embedding model requires dropping and recreating the historical_incidents table
# because vector dimensions must match the stored embeddings.
quarkus.langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.embedding-model.model-id=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
quarkus.langchain4j.ollama.chat-model.model-id=${OLLAMA_CHAT_MODEL:gemma3}
quarkus.langchain4j.ollama.timeout=120s
quarkus.langchain4j.ollama.log-requests=false
quarkus.langchain4j.ollama.log-responses=false
