# Application
quarkus.application.name=servicenow-simulator
quarkus.http.port=8081

# LangChain4j — Ollama (for synthetic incident generation)
quarkus.langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.model-id=${OLLAMA_CHAT_MODEL:gemma3}
quarkus.langchain4j.ollama.timeout=120s
quarkus.langchain4j.ollama.log-requests=false
quarkus.langchain4j.ollama.log-responses=false

# REST client — triage service
quarkus.rest-client.triage-service.url=${TRIAGE_SERVICE_URL:http://localhost:8080}
quarkus.rest-client.triage-service.read-timeout=150000
